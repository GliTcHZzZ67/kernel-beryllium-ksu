name: Build Beryllium LOS 22.2 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AnyKernel Repo
        uses: actions/checkout@v4
        with:
          path: AnyKernel3

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc libncurses5-dev libssl-dev ccache \
            zip curl flex bison libelf-dev libperl-dev python3-dev \
            git wget liblz4-tool lz4 device-tree-compiler

      - name: Clone LineageOS Kernel Source
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_kernel_xiaomi_sdm845 -b lineage-22.2 kernel

      - name: Patch Broken Device Trees
        run: |
          cd kernel
          
          # Remove broken interposer device tree files that reference non-existent nodes
          sed -i '/sdm845-interposer/d' arch/arm64/boot/dts/qcom/Makefile
          sed -i '/sdm845-v2-qvr/d' arch/arm64/boot/dts/qcom/Makefile
          echo "Removed broken device trees from build"
          
          # Verify the patch
          echo "Device trees removed:"
          grep -c "sdm845-interposer" arch/arm64/boot/dts/qcom/Makefile || echo "✓ interposer entries removed"
          grep -c "sdm845-v2-qvr" arch/arm64/boot/dts/qcom/Makefile || echo "✓ QVR entries removed"
          
          # List remaining device trees being built
          echo "Remaining device trees:"
          grep -E "\.dtb" arch/arm64/boot/dts/qcom/Makefile | head -20

      - name: Create Beryllium Defconfig
        run: |
          cd kernel
          # Use SDM845 defconfig as base (Beryllium uses SDM845)
          cp arch/arm64/configs/sdm845_defconfig arch/arm64/configs/beryllium_defconfig
          
          # Add KernelSU and optimization configs
          cat >> arch/arm64/configs/beryllium_defconfig << 'EOF'
          CONFIG_KSU=y
          CONFIG_LOCALVERSION="-LOS22.2-KSU"
          CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y
          EOF

      - name: Integrate KernelSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash - || echo "KernelSU setup completed"

      - name: Download Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
          echo "Clang version:"
          ./clang/bin/clang --version

      - name: Compile Kernel
        run: |
          cd kernel
          
          echo "=== Cleaning build directory ==="
          make O=out clean
          make O=out mrproper
          
          echo "=== Configuring kernel ==="
          make -j$(nproc --all) O=out ARCH=arm64 beryllium_defconfig
          
          if [ ! -f "out/.config" ]; then
            echo "ERROR: Config file not created!"
            exit 1
          fi
          
          echo "=== Compiling kernel ==="
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=$(pwd)/../clang/bin/clang \
            CXX=$(pwd)/../clang/bin/clang++ \
            AR=$(pwd)/../clang/bin/llvm-ar \
            LD=$(pwd)/../clang/bin/ld.lld \
            LLVM_AR=$(pwd)/../clang/bin/llvm-ar \
            LLVM_NM=$(pwd)/../clang/bin/llvm-nm \
            NM=$(pwd)/../clang/bin/llvm-nm \
            OBJCOPY=$(pwd)/../clang/bin/llvm-objcopy \
            OBJDUMP=$(pwd)/../clang/bin/llvm-objdump \
            READELF=$(pwd)/../clang/bin/llvm-readelf \
            STRIP=$(pwd)/../clang/bin/llvm-strip \
            HOSTCC=$(which gcc) \
            HOSTCXX=$(which g++) \
            HOSTLD=$(which ld.gold) \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            2>&1 | tee build.log
          
          # Check build status
          BUILD_STATUS=${PIPESTATUS[0]}
          echo "Build completed with status: $BUILD_STATUS"
          
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "=== Build failed, checking for errors ==="
            grep -i "error:" build.log | head -20
            exit $BUILD_STATUS
          fi
          
          echo "=== Compilation completed successfully ==="

      - name: Check Kernel Output
        run: |
          cd kernel
          echo "=== Checking build artifacts ==="
          
          # Check for kernel image
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "✓ Image.gz-dtb found!"
            ls -lh out/arch/arm64/boot/Image.gz-dtb
            KERNEL_FILE="out/arch/arm64/boot/Image.gz-dtb"
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "✓ Image.gz found (no DTB appended)"
            ls -lh out/arch/arm64/boot/Image.gz
            KERNEL_FILE="out/arch/arm64/boot/Image.gz"
          elif [ -f "out/arch/arm64/boot/Image" ]; then
            echo "✓ Image found (uncompressed)"
            ls -lh out/arch/arm64/boot/Image
            KERNEL_FILE="out/arch/arm64/boot/Image"
          else
            echo "✗ No kernel image found!"
            echo "=== Available files in boot directory ==="
            ls -lh out/arch/arm64/boot/ 2>/dev/null || echo "Boot directory not found"
            exit 1
          fi
          
          # Store path for next step
          echo "KERNEL_FILE=$KERNEL_FILE" >> $GITHUB_ENV

      - name: Pack to AnyKernel3
        run: |
          mkdir -p AnyKernel3/kernels
          
          # Copy kernel image
          echo "Copying ${{ env.KERNEL_FILE }} to AnyKernel3"
          cp "kernel/${{ env.KERNEL_FILE }}" AnyKernel3/kernels/kernel.img
          
          # Create metadata
          echo "Beryllium LOS 22.2 with KernelSU" > AnyKernel3/kernels/device.txt
          echo "$(date '+%Y-%m-%d %H:%M:%S')" > AnyKernel3/kernels/build_date.txt
          
          cd AnyKernel3
          echo "=== Creating flashable zip ==="
          zip -r9 ../Beryllium-LOS22.2-KSU.zip * -x ".git/*" "README.md" ".github/*" "*.git"
          
          echo "=== Zip created ==="
          ls -lh ../Beryllium-LOS22.2-KSU.zip

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Beryllium-LOS22.2-KSU
          path: Beryllium-LOS22.2-KSU.zip
          retention-days: 30
