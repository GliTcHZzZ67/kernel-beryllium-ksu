name: Build Beryllium LOS 22.2 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AnyKernel Repo
        uses: actions/checkout@v4
        with:
          path: AnyKernel3

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev ccache zip curl flex bison libelf-dev

      - name: Clone LineageOS Kernel Source
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_kernel_xiaomi_sdm845 -b lineage-22.2 kernel

      - name: Integrate KernelSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          echo "CONFIG_KSU=y" >> arch/arm64/configs/beryllium_defconfig

      - name: Download Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: Compile Kernel
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"
          cd kernel
          make O=out ARCH=arm64 beryllium_defconfig
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android-

      - name: Pack to AnyKernel3
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../Beryllium-LOS22.2-KSU.zip * -x .git README.md .github

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Beryllium-LOS22.2-KSU
          path: Beryllium-LOS22.2-KSU.zip
